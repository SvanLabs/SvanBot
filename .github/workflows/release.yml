# Release artifacts (#16): on a `v*` tag, the portable bundle is attached to the release with an
# attestation, and a container image goes to ghcr.io/svanlabs/svanbot. `workflow_dispatch` backfills an
# existing tag; a tag older than the `Dockerfile` has no image to build, and the image job says so
# rather than failing. A pull request touching the image only builds it, to prove it still builds.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v10.0.0"
        required: true
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "scripts/container-start.sh", ".github/workflows/release.yml"]

env:
  TAG: ${{ github.event_name == 'pull_request' && 'pr-check' || inputs.tag || github.ref_name }}

jobs:
  bundle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: cd web && npm ci
      - run: scripts/portable.sh
      - id: out
        run: |
          f=$(ls target/dist/*.tar.gz)
          (cd target/dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.out.outputs.file }}
      - run: gh release upload "$TAG" "${{ steps.out.outputs.file }}" "${{ steps.out.outputs.file }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || env.TAG }}
      # The container artifact only exists from the commit that added the Dockerfile, and a tag can
      # predate it — `v10.0.0` does. Backfilling such a tag used to die inside build-push-action with
      # "failed to read dockerfile: open Dockerfile: no such file or directory", which reads like a
      # broken build rather than an old tag. This guard ends the job deliberately and explains itself
      # in the run summary. It must never fall back to another ref: an image carrying a release's tag
      # has to come from that release's tree, or the provenance attestation below means nothing.
      - id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### No container image for $TAG"
            echo
            echo "$TAG is commit $(git rev-parse --short HEAD), which predates the Dockerfile, so"
            echo "there is no container artifact to build for it. The tag and its release bundle are"
            echo "unaffected, and nothing was pushed to ghcr.io."
            echo
            echo "No image is built: only a different ref has a Dockerfile, and an image carrying"
            echo "this tag built from that ref would not be this release."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: steps.dockerfile.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.dockerfile.outputs.present == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/svanlabs/svanbot:${{ env.TAG }}
            ghcr.io/svanlabs/svanbot:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SvanLabs/SvanBot
            org.opencontainers.image.description=Autonomous CPU-only poker-bot fleet for openpoker.ai
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.dockerfile.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/svanlabs/svanbot
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
