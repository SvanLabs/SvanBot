# The release (V11-10): on a `v*` tag, CI builds the one binary the fleet runs, packages it for the
# box, and publishes a checksummed bundle on the GitHub release. The fleet never builds: the updater
# installs only what this built, verified and named, and never while the fleet plays.
#
# One build, one bundle, at one instruction level: the box's. Its QEMU CPU reports every x86-64-v2
# flag (SSE4.2, POPCNT, SSSE3, CX16) and none of v3's (no AVX, AVX2, BMI or FMA), so the program is
# built with `-C target-cpu=x86-64-v2` on any runner: rustc emits the level it is told to, not the
# level of the machine it runs on. The level goes in the bundle's name and in `UPGRADE/cpu`, and
# `install.sh` refuses a bundle built above the CPU it is installing on. Crates that pick a faster
# path at run time (rustls's crypto, memchr) still ask the CPU first, so AVX2 code inside them is
# never reached on a v2 machine.
#
# The job is a release build and `tools/release.ts`, and nothing else: the gate that guards this
# tag already ran on the pull request. RUSTFLAGS names the level outright, dropping the box's
# target-cpu=native, and only dependencies are cached (`cache-workspace-crates: false`), so the
# released bytes are the tag's own sources, rebuilt.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v11.0.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # The box's instruction level, named outright: a target-cpu=native would be the runner's, and the
  # runner is not the box. `tools/release.ts` names the bundle for the same level (its `CPU`).
  RUSTFLAGS: "-C target-cpu=x86-64-v2"
  # Where every build in the project goes, and where `tools/release.ts` reads the programs from.
  # Nothing else sets it: the gate's `cargo()` wrapper does, and this job calls cargo directly.
  CARGO_TARGET_DIR: target/dev
  # The tag being released: the pushed tag, or the one `workflow_dispatch` names.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  bundle:
    name: build and publish the bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: bun install --cwd tools --frozen-lockfile
      # Dependencies are cached; our own crates are rebuilt, so the released bytes are the tag's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target/dev"
          cache-workspace-crates: false
      # The tag is the version: the workspace says `11.0.0-dev` between releases, and the release
      # says what it is called. `v11.0.0` names the release `11.0.0`. The check is strict digits and
      # dots on purpose: a tag may contain `/` (`v1.2.3/../../tmp/x` is a legal tag), and the
      # version becomes the bundle's file name, so anything but `N.N.N` is a path this must refuse.
      - name: read the version from the tag
        id: version
        run: |
          version="${TAG#v}"
          case "$version" in
            *[!0-9.]*) echo "release: tag $TAG is not v<major>.<minor>.<patch>" >&2; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release: tag $TAG is not v<major>.<minor>.<patch>" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release: building $version from $TAG"
      - run: nice -n 15 ionice -c3 cargo build --release --locked -j4 --bins
      - name: package the bundle
        run: bun tools/release.ts --version "${{ steps.version.outputs.version }}" --cpu x86-64-v2
      # The checksum is what the updater verifies before it installs, and what the box cross-checks
      # against the release; publishing it beside the archive is the whole point of the bundle.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: target/dist/*.tar.gz
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag \
            --title "v$version" --notes "v$version, built by CI from $TAG. Verify with the \`.sha256\` beside it before installing."
          gh release upload "$TAG" target/dist/*.tar.gz target/dist/*.tar.gz.sha256 --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
