name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: SvanLabs app token
        id: app-token
        # Fork PRs get no secrets: fall back to the workflow token instead of failing.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SVANLABS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVANLABS_APP_PRIVATE_KEY }}
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action hides the SDK's output by default, which is how every run of this workflow
          # came to fail in about 13 s saying only `is_error: true` (issue #338). The first run with
          # this on named the cause: `"api_error_status": 429`, `"error": "rate_limit"`,
          # `"result": "You've hit your session limit · resets 12:50am (UTC)"`. The review is not
          # broken — the subscription behind the token is out of window, which is the operator's to
          # change (a billed `ANTHROPIC_API_KEY`, a wider plan, or retiring the workflow), and this
          # stays on until they do: a red check that says only that it failed is the whole of #338.
          # Nothing private is printed — the job reads this public repository, and what it writes is
          # the review it would have posted.
          show_full_output: true
          # The SvanLabs GitHub App, so the action acts as svanlabs[bot] rather than
          # claude[bot] or a person's account.
          bot_id: "334763394"
          bot_name: "svanlabs[bot]"
          allowed_bots: "svanlabs"
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The plugin reads the pull request with `gh`, and the subagents it launches do not inherit the
          # command's own allowed-tools, so every tool it declares is allowed here. All of them read,
          # except `gh pr comment`, which posts the review.
          claude_args: '--model claude-opus-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Task,Agent,Read,Glob,Grep"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

