# Keeps `main` current (#370).
#
# `main` is the released line: the branch a stranger installs from and the branch their Update
# fetches. It is meant to hold what `dev` holds whenever `dev` is green, and nothing made it so —
# promotion was a hand-opened pull request, so `main` moved when someone remembered. It moved once,
# on 2026-09-28, and was behind again within the hour.
#
# `scripts/promote.sh` holds the logic and `scripts/tests/promote.sh` tests it; this runs it when
# `check` finishes on `dev`. Everything that decides anything is in the script, including the refusal
# to touch a `main` that carries a commit of its own.
name: promote

on:
  workflow_run:
    # `check` is the workflow's `name:` in check.yml, and `branches` is the *head* branch of the run
    # that finished: a pull request into `dev` carries its own branch here, a push to `main` is
    # filtered out, and the promotion pull request — whose head is `dev` — arrives here too. Running
    # on that one is harmless and useful: it re-arms auto-merge a failed attempt did not set, and the
    # script says the pull request is already open rather than opening a second one.
    workflows: ["check"]
    types: [completed]
    branches: [dev]
  # The retry, for the one case the trigger above cannot reach: no check on `dev` completes again.
  # Everything else — a run that ended `cancelled`, a promotion that could not be armed, a `main`
  # that was diverged when it was last looked at — is picked up by the next check that completes on
  # `dev`, whatever it concluded.
  workflow_dispatch:

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    # Every completed check on `dev` is considered, whatever it concluded, and the guard is not here:
    # it is `check` on the promotion pull request itself, which the ruleset on `main` requires, so a
    # `dev` that would fail the gate cannot merge no matter what starts this job.
    #
    # Filtering on `success` looked like that guard and was never the thing doing the work. What it
    # did was make a promotion depend on the run that *reported*: a run that ends `cancelled` — the
    # normal fate of a push superseded by the next one, and what a preempted runner leaves too — is
    # not `success`, so the job was skipped, and when no later push came, `main` rested behind a `dev`
    # that was green the whole time with nothing said and nothing to retry it (#404). `promote.sh` is
    # idempotent, refuses a `main` carrying content of its own, and returns without a word when the
    # two trees are equal, so looking again costs a few `gh` calls.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The script is `dev`'s, and the repository's default branch is `main` — the line this job
          # promotes *to*. GitHub runs a `workflow_run` workflow from the default branch, so without
          # this the job would read `main`'s copy of a script whose whole subject is moving `main`
          # forward: a fix to `scripts/promote.sh` would have to be promoted before it could promote,
          # which is the one shape that can never resolve itself.
          ref: dev
          # Both branches and their history: the script's ancestor test is one a shallow clone
          # cannot answer.
          fetch-depth: 0

      - name: SvanLabs app token
        id: app-token
        # Not a fork pull request, so this is expected to work; the fallback is the same shape the
        # other workflows use, and `github-actions[bot]` ends in `[bot]`, so the provenance gate
        # exempts the promotion pull request by author whichever token opened it.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SVANLABS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVANLABS_APP_PRIVATE_KEY }}

      - name: Promote
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          SVANBOT_PROMOTE_REPO: ${{ github.repository }}
        run: bash scripts/promote.sh
