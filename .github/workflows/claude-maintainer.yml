# Keeps the repository moving when no one is at a keyboard (#19).
#
# Twice a day Claude takes the oldest open `agent-friendly` issue that no pull request closes yet,
# fixes it on a branch cut from `dev`, runs the gate and opens a pull request into `dev` (the default
# branch) with auto-merge on. The ruleset on `dev` and `main` requires the `check` job, so nothing
# lands unless the full gate is green.
name: Claude maintainer

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

concurrency:
  group: claude-maintainer
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: SvanLabs app token
        id: app-token
        # Fork PRs get no secrets: fall back to the workflow token instead of failing.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SVANLABS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVANLABS_APP_PRIVATE_KEY }}
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The SvanLabs GitHub App, so the action acts as svanlabs[bot] rather than
          # claude[bot] or a person's account.
          bot_id: "334763394"
          bot_name: "svanlabs[bot]"
          # The action refuses a run whose actor is a bot unless the bot is named here. A dispatch from
          # the SvanLabs app is exactly that: it failed with `Workflow initiated by non-human actor:
          # svanlabs (type: Bot)`. The review and triage workflows carry the same line for the runs the
          # app starts on their events.
          allowed_bots: "svanlabs"
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            You maintain ${{ github.repository }}. Read AGENTS.md and CONTRIBUTING.md first and follow them exactly.

            1. List open issues labelled `agent-friendly`, oldest first. Skip any that an open pull request
               already closes (`gh pr list --search "<number> in:body"`). Take the first remaining one.
               If none remain, stop.
            2. Create a branch named for the change, make the fix, and add a test that fails without it
               when it is a bug. Keep the change to that one issue.
            3. Run `scripts/check.sh full`. If it fails and you cannot fix it, stop and comment on the
               issue with what you found instead of opening a pull request.
            4. Commit in the shape CONTRIBUTING.md describes, ending with
               `Generated-by: claude-code/claude-fable-5-1`, push, and open a pull request from
               .github/pull_request_template.md with `Closes #<issue>` and the same Generated-by line.
            5. Turn on auto-merge: `gh pr merge <number> --auto --squash`.

            Never commit keys, email addresses or home-directory paths. A behaviour change to the bot
            needs a paired simulation (`sim paired`) in the pull request, as AGENTS.md says; if you
            cannot provide one, comment on the issue instead of opening the pull request.
          claude_args: |
            --model claude-fable-5-1
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
