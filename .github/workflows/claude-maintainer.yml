# Keeps the repository moving when no one is at a keyboard (#19).
#
# Twice a day Claude takes the oldest open `agent-friendly` issue that no pull request closes yet,
# fixes it on a branch cut from `main`, runs the gate and opens a pull request into `main` — the
# default branch and the released line. Auto-merge is on, and the ruleset on `main` requires the
# `check` job, so nothing lands unless the full gate is green.
name: Claude maintainer

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

concurrency:
  group: claude-maintainer
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      # The same opt-out the `gate` job makes, for the same reason (#330): `.cargo/config.toml`
      # compiles for the machine doing the compiling (`target-cpu=native`), and the cache below
      # carries `target/dev` between runners. Runners are heterogeneous, so a test binary built on a host
      # with a wider instruction set reaches one without it and dies with SIGILL — a red run whose log
      # reads like a failed test. `RUSTFLAGS` replaces the config file's setting rather than adding to
      # it, which is how `Dockerfile` and `scripts/portable.sh` opt out; cargo fingerprints it, so
      # artifacts a previous runner cached under `native` are rebuilt rather than reused. The baseline
      # is the one the release image ships, so this job compiles and runs what a release has.
      RUSTFLAGS: -C target-cpu=x86-64-v2
      # Where `scripts/check.sh` builds when nothing sets it (`check.sh:22`), and what CLAUDE.md tells a
      # person running cargo by hand to name. Pinning it here puts every build in this job in the one
      # directory the cache below holds — including the agent's own `cargo` calls, which would
      # otherwise go to `target/` and be compiled again by the gate.
      CARGO_TARGET_DIR: target/dev
    steps:
      - uses: actions/checkout@v7
        with:
          # A scheduled run checks out the repository default, which is `main` — the branch the job
          # works and the branch its pull request targets, so this pin is belt and braces rather than
          # a correction. The note that used to be here reasoned about promotion merges, which no
          # longer exist.
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # `scripts/check.sh` runs `tsc`, which needs `web/node_modules`, so the agent's first `npm ci`
          # is on the path of every run. The cache is the download, not the install: the same file the
          # `gate` job caches, and the same reason.
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The gate restores the same caches and this job had none (#363, item 4), so a twice-daily run
      # paid a cold `npm ci` and a cold compile of the whole workspace before the agent did anything:
      # `clippy -D warnings took 171 s` and the first `full took 227 s`, against `full took 121 s` warm
      # in the same run. `target/dev` is named because it is where `check.sh` builds and what
      # `CARGO_TARGET_DIR` above pins — rust-cache's default target directory is `target/`, which this
      # job no longer writes to, so the cache would hold nothing.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: |
            target/dev
            artifacts/tables
      # `cloud-setup.sh` installs cargo-deny into `~/.cargo/bin`, and no cache held it: every runner
      # downloaded it again, inside the agent's session (#418). Just the one binary rather than the
      # directory, because rustup keeps its own shims there. The key names the installer, so a change
      # to how cargo-deny is obtained takes a fresh cache instead of restoring the old binary.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ hashFiles('scripts/cloud-setup.sh') }}

      # What `scripts/check.sh` needs and this job did not install: cargo-deny, `web/node_modules`
      # and `artifacts/tables` (the `gate` job has run this same step all along). Without it a fresh
      # runner failed the gate at `error: no such command: deny` — an issue-independent red — and the
      # agent's own reading of its prompt is to stop and comment instead of opening a pull request.
      # The tables are why `artifacts/tables` is in the cache above: cloud-setup builds them when
      # they are missing, about a minute, and paying that per run would be a regression against #363.
      - name: Setup (cargo-deny, web deps, tables)
        run: bash scripts/cloud-setup.sh

      - name: SvanLabs app token
        id: app-token
        # Fork PRs get no secrets: fall back to the workflow token instead of failing.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SVANLABS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVANLABS_APP_PRIVATE_KEY }}
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # The action hides the SDK's output by default, which is how the first run that got past the
          # actor guard came to fail in 20.8 s saying only `is_error: true` (issue #398, run
          # 36383892070: `"duration_ms": 410, "num_turns": 1, "total_cost_usd": 0, "modelUsage": {}`).
          # That is the shape #338 was opened for on `claude-code-review.yml`, and the same line named
          # its cause: `"api_error_status": 429`, `"error": "rate_limit"`. A scheduled job that fails
          # without saying why is the defect either way, so this stays on until a dispatch runs green.
          # Nothing private is printed: the job reads this public repository and writes only the branch
          # and the pull request it would have opened.
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The SvanLabs GitHub App, so the action acts as svanlabs[bot] rather than
          # claude[bot] or a person's account.
          bot_id: "334763394"
          bot_name: "svanlabs[bot]"
          # The action refuses a run whose actor is a bot unless the bot is named here. A dispatch from
          # the SvanLabs app is exactly that: it failed with `Workflow initiated by non-human actor:
          # svanlabs (type: Bot)`. The review and triage workflows carry the same line for the runs the
          # app starts on their events.
          allowed_bots: "svanlabs"
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          prompt: |
            You maintain ${{ github.repository }}. Read AGENTS.md and CONTRIBUTING.md first and follow them exactly.

            1. List open issues labelled `agent-friendly`, oldest first. Skip any that an open pull request
               already closes (`gh pr list --search "<number> in:body"`). Take the first remaining one.
               If none remain, stop.
            2. Create a branch named for the change, make the fix, and add a test that fails without it
               when it is a bug. Keep the change to that one issue.
            3. Run `scripts/check.sh full`. If it fails and you cannot fix it, stop and comment on the
               issue with what you found instead of opening a pull request.
            4. Commit in the shape CONTRIBUTING.md describes, ending with
               `Generated-by: claude-code/claude-opus-5`, push, and open a pull request into `main`
               from .github/pull_request_template.md with `Closes #<issue>` and the same Generated-by
               line — plain `gh pr create`, since the base GitHub offers by default is `main`, the
               branch the pull request belongs against.
            5. Turn on auto-merge: `gh pr merge <number> --auto --merge`.

            Never commit keys, email addresses or home-directory paths. A behaviour change to the bot
            needs a paired simulation (`sim paired`) in the pull request, as AGENTS.md says; if you
            cannot provide one, comment on the issue instead of opening the pull request.

            A commit whose `Generated-by:` names a system that is not yet in AI-PROVENANCE.md reddens
            the provenance check on the first pull request that carries it; section 0 of
            CONTRIBUTING.md says how that file is regenerated, and regenerating it belongs in that
            pull request.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
