# The gate, on every pull request and every push to main (the released line the fleet runs).
#
# `scripts/check.sh full` here is the same command a contributor runs locally, so a red run in CI and
# a red run at the desk are the same failure with the same fix. That is deliberate: a workflow that
# ran a different set of checks would make "it passes locally" worthless.
#
# The jobs are split for time-to-first-answer, not for coverage. `web` finishes in about a minute, so
# a change under `web/` gets its answer without waiting on a Rust build; `gate` runs everything,
# including the parts `web` already covered. Duplicating a minute of TypeScript checking is cheaper
# than teaching people to ignore a ten-minute wait.
name: check

on:
  pull_request:
    # The gate reads the pull request body, so an edit to it has to be able to change the answer.
    # Without `edited`, a body that omits the trailer could only be corrected with a commit, and the
    # natural fix — editing the description — would leave a red check standing on a pull request that
    # is already correct. `opened`, `synchronize` and `reopened` are the defaults and are listed to
    # say so rather than by omission.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here writes to the repository, and the one job that needs to reach
# outside it — none, currently — would have to ask for the permission by name.
permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Types
        working-directory: web
        # Both tsconfigs, via the same script scripts/check.sh runs: `tsc --noEmit` alone compiles
        # `src` and stops, which left the Playwright specs unchecked.
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target/dev
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Use the selected target's baseline ISA so cached artifacts remain portable across hosts.
      # An explicit empty RUSTFLAGS overrides target-cpu=native in the local Cargo configuration.
      RUSTFLAGS: ""
    steps:
      # Full history, because the gate's first step reads the commits this pull request adds and
      # compares them against the base branch. `actions/checkout` fetches a single commit by default,
      # which is enough for every other step here and not for that one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The pull request description is not a file in the tree, so `scripts/check.sh` reads it from
      # the file named by `SVANBOT_PR_BODY` and checks the commits alone when that names nothing.
      # This step is the writing half of that: the body is untrusted text, so it goes into the
      # environment and out to a file, and only the constant path reaches `GITHUB_ENV` — a
      # description containing `$(…)` or a backtick would otherwise run here.
      #
      # `SVANBOT_PR_AUTHOR` is the login that opened the pull request. It is what exempts a
      # bot-opened pull request from naming a system, the same way the author field exempts a
      # bot-authored commit, and it is carried the same way for the same reason: a login is chosen
      # by its owner, so it is data, not script text.
      #
      # On a push or a manual run there is no body, the variable is never set, and the commits-only
      # branch is what runs. Setting the variable job-wide instead would be worse than unusable: it
      # would name a file that no step wrote, and `scripts/check.sh` treats a named body as one that
      # must be there, so every push to main would fail the gate.
      - name: Pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          echo "SVANBOT_PR_BODY=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_ENV"
          echo "SVANBOT_PR_AUTHOR=$PR_AUTHOR" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # `artifacts/tables` is cached beside the build: 96 MB of board strengths that `cloud-setup.sh`
      # generates in about a minute, unchanged between runs, and expensive enough that paying for it
      # on every pull request would be the slowest step here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: |
            target/dev
            artifacts/tables
      # cargo-deny, web/node_modules and the board-strength tables. The gate's notices check reads the
      # installed npm packages, so it cannot run on a checkout that has never run `npm ci`.
      - name: Setup (cargo-deny, web deps, tables)
        run: bash scripts/cloud-setup.sh
      - name: scripts/check.sh full
        run: |
          # A pull request always has a description, so on a pull request an unset or dangling
          # variable means the step above did not do its job. That is not hypothetical: no step here
          # set `SVANBOT_PR_BODY`, so the pull-request half of the provenance check never ran and a
          # green gate said nothing about it. Say so here, at the point of use, instead of passing.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ ! -f "${SVANBOT_PR_BODY:-}" ]; then
            echo "::error::SVANBOT_PR_BODY is unset or names no file: the pull request body did not reach the gate"
            exit 1
          fi
          # Every pull request has an author too, so an empty one means the same thing: the step above
          # did not do its job, and the gate would report a system-less body for a bot-opened pull
          # request that is meant to be exempt (#367).
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -z "${SVANBOT_PR_AUTHOR:-}" ]; then
            echo "::error::SVANBOT_PR_AUTHOR is unset: the author that exempts a bot-opened pull request did not reach the gate"
            exit 1
          fi
          bash scripts/check.sh full
      - name: Test log on failure
        if: failure()
        run: tail -200 target/dev/check-tests.log 2>/dev/null || true

  # The one status check to require in branch protection.
  #
  # Requiring each job by name means every new job is unprotected until someone remembers to add it.
  # Requiring this instead means a job added to `needs` below is covered the moment it exists, and a
  # job that never ran fails the aggregate rather than passing quietly.
  check:
    name: check
    if: always()
    needs: [web, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: |
          failed=0
          for result in "web=${{ needs.web.result }}" "gate=${{ needs.gate.result }}"; do
            echo "$result"
            case "$result" in
              *=success) ;;
              *) echo "::error::${result%%=*} did not succeed"; failed=1 ;;
            esac
          done
          exit "$failed"
