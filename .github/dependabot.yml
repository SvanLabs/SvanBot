# Dependency updates, grouped and capped so they arrive as a few reviewable pull requests rather than
# one per crate. Dependabot's commits are authored `dependabot[bot]`, which the provenance gate exempts
# (scripts/provenance.py). A Cargo.lock change also moves docs/THIRD-PARTY-NOTICES.md: if the notices check
# is red on one of these, `python3 scripts/notices.py` regenerates it.
#
# `target-branch: main` on every entry, kept explicit rather than removed: Dependabot opens against
# the repository's default branch when it is not told otherwise, and that default is `main` — the
# released line — so naming it changes nothing today. It is named because a fork can move its own
# default, and because #402 asked for the target to be a visible choice rather than an inherited one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    target-branch: main
    open-pull-requests-limit: 2
    labels: [area:crates]
    groups:
      rust-dependencies: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    target-branch: main
    open-pull-requests-limit: 2
    labels: [area:web]
    groups:
      web-dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: main
    open-pull-requests-limit: 2
    labels: [area:ci]
    groups:
      actions: { patterns: ["*"] }
