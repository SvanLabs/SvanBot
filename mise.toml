# Every tool v11 builds and checks with, pinned (V11-03). Each pin was the latest stable release on
# 2026-11-15. `mise run setup` installs them, and `mise run commit` / `mise run full` run the gate.
# TypeScript and the Bun types are pinned in tools/package.json, with their lockfile.
[tools]
rust = { version = "1.100.0", profile = "minimal", components = "rustfmt,clippy" }
bun = "1.4.4"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
biome = "2.6.7"

[tasks.setup]
description = "Install the pinned tools and the TypeScript packages, and turn the git hooks on"
run = [
  "mise install",
  "mise exec -- bun install --cwd tools --frozen-lockfile",
  "git config core.hooksPath .githooks",
]

[tasks.commit]
description = "The gate's commit tier: what the pre-commit hook runs"
run = "bun tools/gate.ts commit"

[tasks.full]
description = "The gate's full tier: run it before a push"
run = "bun tools/gate.ts full"
