[workspace]
resolver = "3"
# The layers, lowest first (docs/adr/0003-crate-graph.md). A crate depends only on its own layer or
# lower ones, and only runtime and apps touch the network, the store or the clock.
members = [
    "crates/core",
    "crates/sim",
    "crates/strategy",
    "crates/learn",
    "crates/runtime",
    "crates/apps/*",
]

[workspace.package]
version = "11.0.0-dev"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SvanLabs/SvanBot"
publish = false

# One source for every internal path and every third-party version. A crate names them with
# `x.workspace = true`. An entry lands with its first use: cargo warns on an unused one.
[workspace.dependencies]
svanbot-core = { path = "crates/core" }
svanbot-learn = { path = "crates/learn" }
svanbot-sim = { path = "crates/sim" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# SQLite compiled in, so the box needs no system library and every machine runs the same one.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde_json = "1.0.154"
svanbot-runtime = { path = "crates/runtime" }
svanbot-strategy = { path = "crates/strategy" }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# The REST API, over the same rustls, ring and webpki-roots as the WebSocket.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# No placeholder code ships.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Line tables are enough for a backtrace with file and line, and they cut the debug info that fills
# target/ (tools/disk.ts reports its budget). Tests inherit this profile.
[profile.dev]
debug = "line-tables-only"

# The third-party crates a pure layer (core, sim, strategy, learn) may take, each with its reason.
# `tools/layering.ts` rejects any other. A crate earns a place here only if it does no I/O, reads no
# clock and keeps results the same for the same inputs.
[workspace.metadata.layering.pure-third-party]
