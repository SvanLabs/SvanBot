# cargo-deny: what a dependency must be to enter the workspace (V11-03). CI runs it on every pull
# request, and weekly once v11 is the default branch, since advisories arrive with no change of ours.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only. Our own crates are publish = false, so they are not checked.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates name each other by path alone. They are never published (publish = false), so a
# path with no version is not a wildcard anyone could resolve differently.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
