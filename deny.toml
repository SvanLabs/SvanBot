# cargo-deny policy (scripts/check.sh). Dependencies must stay publishable under our license:
# permissive licenses only, crates.io only, no wildcard versions.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
]

[licenses.private]
# Workspace crates are `publish = false`; their license is the repository's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"
