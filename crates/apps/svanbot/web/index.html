<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SvanBot</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="strip" aria-live="polite">
      <a class="brand" href="/">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle class="chip-face" cx="16" cy="16" r="11" />
          <circle class="chip-ring" cx="16" cy="16" r="14" />
          <path
            class="chip-suit"
            d="M16 8c3 4 7 6 7 10a4 4 0 0 1-6 3l1 3h-4l1-3a4 4 0 0 1-6-3c0-4 4-6 7-10z"
          />
        </svg>
        SvanBot
      </a>
      <nav aria-label="Pages">
        <a href="/">Fleet</a>
        <a href="/scoreboard">Scoreboard</a>
        <a href="/release">Release</a>
      </nav>
      <span id="count" class="muted"></span>
      <span id="fresh" class="pill warn">connecting</span>
      <strong id="worst" class="worst"></strong>
    </header>
    <main id="view">
      <p class="muted">Waiting for the fleet…</p>
    </main>
    <noscript><p>The dashboard needs JavaScript to follow the event stream.</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
